        Save Changes
      </button>
</footer>

<script>
    let isBlocked = false;

    function toggleDrawer() {
      const drawer = document.getElementById('roomEditDrawer');
      const overlay = document.getElementById('drawerOverlay');
      
      if (drawer.classList.contains('drawer-closed')) {
        drawer.classList.remove('drawer-closed');
        drawer.classList.add('drawer-open');
        overlay.classList.remove('overlay-inactive');
        overlay.classList.add('overlay-active');
      } else {
        drawer.classList.add('drawer-closed');
        drawer.classList.remove('drawer-open');
        overlay.classList.add('overlay-inactive');
        overlay.classList.remove('overlay-active');
      }
    }

    function toggleStatus() {
      const toggle = document.getElementById('statusToggle');
      const circle = toggle.querySelector('span');
      const blockReason = document.getElementById('blockReason');
      
      isBlocked = !isBlocked;
      
      if (isBlocked) {
        toggle.classList.remove('bg-status-green-text');
        toggle.classList.add('bg-status-red-text');
        circle.classList.remove('translate-x-5');
        circle.classList.add('translate-x-0');
        blockReason.classList.remove('hidden');
      } else {
        toggle.classList.add('bg-status-green-text');
        toggle.classList.remove('bg-status-red-text');
        circle.classList.add('translate-x-5');
        circle.classList.remove('translate-x-0');
        blockReason.classList.add('hidden');
      }
    }

    function saveChanges() {
      // Micro-interaction for feedback
      const btn = event.currentTarget;
      const originalText = btn.innerHTML;
      btn.innerHTML = `<span class="material-symbols-outlined animate-spin">refresh</span>`;
      btn.disabled = true;
      
      setTimeout(() => {
        btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span>`;
        btn.classList.add('bg-status-green-text');
        
        setTimeout(() => {
          toggleDrawer();
          btn.innerHTML = originalText;
          btn.disabled = false;
          btn.classList.remove('bg-status-green-text');
        }, 800);
      }, 1200);
    }
  </script>
