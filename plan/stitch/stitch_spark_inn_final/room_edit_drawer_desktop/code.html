<input class="w-full h-[44px] px-4 rounded-lg border border-border-standard bg-surface-container-lowest font-body-sm text-body-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-shadow" id="room_name" type="text" value="Deluxe King Ocean View">
</div>
<!-- Room Type & Capacity Grid -->
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block font-label-md text-label-md text-text-secondary mb-1.5" for="room_type">Room Type</label>
<div class="relative">
<select class="w-full h-[44px] pl-4 pr-10 rounded-lg border border-border-standard bg-surface-container-lowest font-body-sm text-body-sm text-on-surface appearance-none focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-shadow cursor-pointer" id="room_type">
<option>Standard</option>

<option>Suite</option>
</select>

</div>

<div>
<label class="block font-label-md text-label-md text-text-secondary mb-1.5" for="bed_type">Bed Type</label>
<input class="w-full h-[44px] px-4 rounded-lg border border-border-standard bg-surface-container-lowest font-body-sm text-body-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-shadow" id="bed_type" type="text" value="1 King Bed">
</div>

</div>
<span class="font-body-sm text-body-sm text-on-surface group-hover:text-primary-container transition-colors">High-Speed WiFi</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group min-h-[32px]">
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" type="checkbox">
<div class="w-5 h-5 rounded border border-border-standard bg-surface-container-lowest peer-checked:bg-primary-container peer-checked:border-primary-container transition-colors group-hover:border-primary-container"></div>
<span class="material-symbols-outlined absolute text-[16px] text-white opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface group-hover:text-primary-container transition-colors">Air Conditioning</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group min-h-[32px]">
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" type="checkbox">
<div class="w-5 h-5 rounded border border-border-standard bg-surface-container-lowest peer-checked:bg-primary-container peer-checked:border-primary-container transition-colors group-hover:border-primary-container"></div>
<span class="material-symbols-outlined absolute text-[16px] text-white opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface group-hover:text-primary-container transition-colors">Private Balcony</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group min-h-[32px]">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" type="checkbox">
<div class="w-5 h-5 rounded border border-border-standard bg-surface-container-lowest peer-checked:bg-primary-container peer-checked:border-primary-container transition-colors group-hover:border-primary-container"></div>
<span class="material-symbols-outlined absolute text-[16px] text-white opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface group-hover:text-primary-container transition-colors">Kitchenette</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group min-h-[32px]">
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" type="checkbox">
<div class="w-5 h-5 rounded border border-border-standard bg-surface-container-lowest peer-checked:bg-primary-container peer-checked:border-primary-container transition-colors group-hover:border-primary-container"></div>
<span class="material-symbols-outlined absolute text-[16px] text-white opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface group-hover:text-primary-container transition-colors">Minibar</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group min-h-[32px]">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" type="checkbox">
<div class="w-5 h-5 rounded border border-border-standard bg-surface-container-lowest peer-checked:bg-primary-container peer-checked:border-primary-container transition-colors group-hover:border-primary-container"></div>
<span class="material-symbols-outlined absolute text-[16px] text-white opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>

</label>
</div>
</section>
<hr class="border-border-standard">
<!-- Status & Availability -->
<section class="space-y-4 pb-4">
<h3 class="font-h4 text-h4 text-on-surface">Status &amp; Availability</h3>
<div>
<label class="block font-label-md text-label-md text-text-secondary mb-1.5" for="room_status">Operational Status</label>
<div class="relative">
<select class="w-full h-[44px] pl-4 pr-10 rounded-lg border border-border-standard bg-surface-container-lowest font-body-sm text-body-sm text-on-surface appearance-none focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-shadow cursor-pointer" id="room_status" onchange="toggleBlockReason(this.value)">
<option selected="" value="available">Available for Booking</option>
<option value="blocked">Blocked / Maintenance</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-text-secondary pointer-events-none">expand_more</span>
</div>
</div>
<!-- Conditional Block Reason (Hidden by default, shown via inline JS for demo purposes if blocked is selected. Setting to hidden initially) -->
<div class="hidden space-y-1.5 transition-all duration-300" id="block_reason_container">
<label class="block font-label-md text-label-md text-status-amber-text" for="block_reason">Reason for Blocking</label>
<textarea class="w-full p-3 rounded-lg border border-status-amber-text/30 bg-status-amber-bg font-body-sm text-body-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-status-amber-text/50 focus:border-transparent transition-shadow resize-none" id="block_reason" placeholder="e.g., AC maintenance needed" rows="2"></textarea>
</div>
</section>
</div>
<!-- Sticky Footer -->
<footer class="border-t border-border-standard bg-surface-container-lowest px-6 py-4 flex justify-end gap-3 shrink-0">
<button class="h-[44px] px-6 rounded-lg font-label-md text-label-md text-text-secondary border border-border-standard bg-surface-container-lowest hover:bg-surface-container focus:outline-none focus:ring-2 focus:ring-primary-container transition-colors">
                Cancel
            </button>
<button class="h-[44px] px-6 rounded-lg font-label-md text-label-md text-on-primary bg-primary-container hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 transition-colors">
                Save Changes
            </button>
</footer>
</div>
<script>
        // Simple micro-interaction for status toggle demonstration
        function toggleBlockReason(status) {
            const container = document.getElementById('block_reason_container');
            if (status === 'blocked') {
                container.classList.remove('hidden');
                // slight delay to allow display:block to apply before animating opacity if we wanted to
            } else {
                container.classList.add('hidden');
            }
        }
    </script>
