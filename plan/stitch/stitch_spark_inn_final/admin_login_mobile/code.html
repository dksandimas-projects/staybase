<body class="bg-page-bg min-h-screen flex items-center justify-center p-6 selection:bg-primary-container selection:text-white">
<!-- Main Content Canvas -->
<main class="w-full max-w-max-width-auth animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-border-standard p-10 flex flex-col items-center">
<!-- Brand Logo -->
<div class="mb-8">
<h1 class="font-h2 text-h2 text-primary lowercase tracking-tight">spark inn</h1>
</div>
<!-- Header Section -->
<div class="text-center mb-10">
<h2 class="font-h2 text-h2 text-on-surface mb-2">Staff Portal</h2>
<p class="font-body-sm text-body-sm text-status-gray-text">For authorized personnel only.</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-6" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="email">Email Address</label>
<div class="relative group">
<input class="w-full h-[44px] px-4 rounded-lg border border-border-standard bg-white text-on-surface focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container outline-none transition-all placeholder:text-status-gray-text/50" id="email" name="email" placeholder="admin@sparkinn.com" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="password">Password</label>
<div class="relative group">
<input class="w-full h-[44px] px-4 pr-12 rounded-lg border border-border-standard bg-white text-on-surface focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container outline-none transition-all placeholder:text-status-gray-text/50" id="password" name="password" placeholder="••••••••" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 h-8 w-8 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full h-[44px] bg-primary-container text-white font-h4 text-h4 rounded-lg hover:bg-primary-hover active:scale-[0.98] transition-all shadow-md shadow-primary-container/20 mt-4 flex items-center justify-center gap-2 group" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">login</span>
</button>
</form>
</div>
<!-- Footer Decoration / Ambient Image -->
<div class="mt-12 opacity-40 grayscale hover:grayscale-0 transition-all duration-1000">
<img alt="Hospitality Efficiency" class="w-full h-32 object-cover rounded-xl" data-alt="A clean, minimalist high-angle shot of a boutique hotel reception desk in Bohol. The scene is bathed in bright, warm natural sunlight, creating a high-end sanctuary feel. The surfaces are smooth, neutral-toned natural stone and warm wood. The overall aesthetic is focused on boutique luxury, efficiency, and professional hospitality, with a soft blur in the background to maintain focus on the central desk area." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDgxmQX8OTmYw-Q5Ov88diOd5j8EoHwM2Xb5KuUGNdMEczvC1e--iTPgZb2vwA7c1TJRyG1L5FkPL66OtkRwiro16kFXNFL1n3Ajf5hi78f87eOV5cEtLMtiPOtaGAG-iZ5bK4n9b_4u6FrVVr6uhkMHe1NB_82Kjmr25K4QD2QO89ebJhyR56asQzJqVCdkQCJH9Bc9FnRST3DRZFxVLk5B23-ij8sZTHHLWICdo1jMe2otzfc95yv1_V0HTOVXgASNJlYTK4pKvRa">
</div>
</main>
<!-- Footer Component (Shared Anchor) -->
<footer class="fixed bottom-0 w-full flex flex-col items-center gap-4 pb-8 w-full">
<div class="flex items-center gap-6">
<a class="font-label-sm text-label-sm text-status-gray-text hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">privacy</a>
<a class="font-label-sm text-label-sm text-status-gray-text hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">terms</a>
<a class="font-label-sm text-label-sm text-status-gray-text hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">support</a>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant">© 2024 spark inn. all rights reserved.</p>
</footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }
    </script>
