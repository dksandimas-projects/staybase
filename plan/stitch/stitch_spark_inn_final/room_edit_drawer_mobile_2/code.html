<!-- Toggle Switch (Simulated) -->
<label class="relative inline-flex items-center cursor-pointer min-h-[44px]">
<input checked="" class="sr-only peer" id="statusToggle" type="checkbox"/>
<div class="w-11 h-6 bg-surface-dim rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-border-standard after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
<span class="ml-3 font-label-md text-label-md text-on-surface" id="statusLabel">Available</span>
</label>
</div>
<!-- Conditional Textarea for Block Reason (Hidden by default) -->
<div class="hidden space-y-2 mt-4 transition-all duration-300 opacity-0 h-0 overflow-hidden" id="blockReasonContainer">
<label class="block font-label-md text-label-md text-text-secondary" for="blockReason">Reason for blocking</label>
<textarea class="w-full rounded-lg border-border-standard bg-surface-container-lowest text-on-surface font-body-sm text-body-sm p-4 focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-shadow resize-none" id="blockReason" placeholder="e.g., Maintenance, Deep Cleaning..." rows="2"></textarea>
</div>

</div>
<!-- Sticky Footer -->
<div class="p-6 border-t border-border-standard bg-surface-container-lowest shrink-0">
<button class="w-full min-h-[44px] bg-primary-container hover:bg-primary-hover text-on-background font-label-md text-label-md font-semibold rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container">
                Save Changes
            </button>

<script>
        // Simple script to handle the conditional 'Block Reason' textarea visibility
        const statusToggle = document.getElementById('statusToggle');
        const statusLabel = document.getElementById('statusLabel');
        const blockReasonContainer = document.getElementById('blockReasonContainer');

        statusToggle.addEventListener('change', function() {
            if (this.checked) {
                statusLabel.textContent = 'Available';
                blockReasonContainer.classList.add('hidden', 'opacity-0', 'h-0');
                blockReasonContainer.classList.remove('opacity-100', 'h-auto');
            } else {
                statusLabel.textContent = 'Blocked';
                blockReasonContainer.classList.remove('hidden', 'opacity-0', 'h-0');
                // Small delay to allow display:block to apply before animating opacity
                setTimeout(() => {
                    blockReasonContainer.classList.add('opacity-100', 'h-auto');
                }, 10);
            }
        });
    </script>
