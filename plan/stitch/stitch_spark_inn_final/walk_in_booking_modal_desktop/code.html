<script>
        // Simple script to toggle number inputs (visual only for this prototype)
        document.querySelectorAll('input[type="number"]').forEach(input => {
            const minusBtn = input.previousElementSibling;
            const plusBtn = input.nextElementSibling;
            
            if(minusBtn && minusBtn.tagName === 'BUTTON') {
                minusBtn.addEventListener('click', () => {
                    let min = input.getAttribute('min') ? parseInt(input.getAttribute('min')) : 0;
                    if(parseInt(input.value) > min) {
                        input.value = parseInt(input.value) - 1;
                    }
                });
            }
            if(plusBtn && plusBtn.tagName === 'BUTTON') {
                plusBtn.addEventListener('click', () => {
                    input.value = parseInt(input.value) + 1;
                });
            }
        });
    </script>
