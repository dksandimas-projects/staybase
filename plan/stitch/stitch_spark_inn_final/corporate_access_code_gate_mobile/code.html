<body class="bg-page-bg text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<nav class="fixed top-0 w-full bg-surface dark:bg-background z-50">
<div class="flex justify-between items-center px-6 py-4 w-full max-w-7xl mx-auto">
<span class="font-h2 text-h2 text-primary dark:text-inverse-primary lowercase tracking-tight">spark inn</span>
<div class="flex gap-4 items-center">
<button class="text-on-surface-variant dark:text-on-secondary-container hover:text-primary-hover transition-colors active:scale-95 transition-transform">
<span class="material-symbols-outlined">help</span>
</button>
<button class="text-on-surface-variant dark:text-on-secondary-container hover:text-primary-hover transition-colors active:scale-95 transition-transform">
<span class="material-symbols-outlined">lock</span>
</button>
</div>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-6 pt-24 pb-32 w-full">
<!-- Hero Background Effect (Atmospheric) -->
<div class="fixed inset-0 pointer-events-none overflow-hidden opacity-20">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-fixed rounded-full blur-[120px]"></div>
<div class="absolute top-1/2 -right-24 w-64 h-64 bg-secondary-fixed rounded-full blur-[100px]"></div>
</div>
<!-- Corporate Access Card -->
<div class="relative z-10 w-full max-w-auth bg-surface-container-lowest rounded-xl shadow-sm border border-border-standard p-8 md:p-10 transition-all duration-500 hover:shadow-lg">
<!-- Card Header: Icon & Title -->
<div class="flex flex-col items-center text-center space-y-6">
<div class="w-16 h-16 rounded-full bg-primary-light flex items-center justify-center">
<img alt="spark inn logo icon" class="w-10 h-10 object-contain" data-alt="A clean and minimalist circular logo for a premium boutique hotel named spark inn. The logo icon is elegantly designed with a subtle orange spark motif centered in a soft warm background, reflecting the brand's boutique luxury and welcoming sanctuary atmosphere. The visual style is modern, high-end, and focuses on warm minimal aesthetics with high information density for professional administration." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDdFFiX0FB8GFORr5f19knHdapnzKMD5w0Wzprg0joQ1TWIMRoi2hXXhcSvfQhj7bbroHunXsx1RYbop1eM4S1KpuqCzCu1pOufMCcL8AW06Gm-lF9mOvWIwQUAia16Ol9W-0WcKSTpnnQ5BGaVnDhcQDHhCWlBz8CDK7ovzLnrQFRJDfe_lvH_HQo50N1TBAB_tn9R_iuWVGGRDU9JdBhl-xwGp2efLdcipKNPHV5dL_-aqp8lhc4MI1Pkzqn8Vy1ySQ0bNJDBksq7">
</div>
<div class="space-y-2">
<h1 class="font-h2 text-h2 text-on-surface">Corporate Booking</h1>
<p class="font-body-sm text-body-sm text-text-secondary px-4">
                        Please enter your corporate access code to unlock exclusive rates and benefits.
                    </p>
</div>
</div>
<!-- Form Section -->
<form class="mt-10 space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1 uppercase tracking-wider" for="access-code">Access Code</label>
<div class="relative group">
<input class="w-full h-[44px] px-4 rounded-lg border border-border-standard bg-white font-body-sm text-body-sm text-on-surface placeholder:text-status-gray-text focus:ring-2 focus:ring-primary-container focus:border-primary transition-all outline-none" id="access-code" placeholder="Enter code" required="" type="text">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-status-gray-text pointer-events-none group-focus-within:text-primary transition-colors">
                            key
                        </span>
</div>
</div>
<button class="w-full h-[44px] bg-primary-container hover:bg-primary-hover text-white font-h4 text-h4 rounded-lg shadow-sm transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
                    Proceed
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Verification Status / Hint -->
<div class="mt-8 pt-6 border-t border-border-standard flex items-center justify-center gap-2 text-status-gray-text">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span class="font-label-sm text-label-sm">Secure and private corporate portal</span>
</div>
</div>

<div class="flex flex-col items-center gap-4 pb-8 w-full">

<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">support</a>
</div>
<p class="font-label-sm text-label-sm text-status-gray-text">© 2024 spark inn. all rights reserved.</p>
</div>
</footer>
<script>
        // Micro-interaction for input field
        const accessInput = document.getElementById('access-code');
        accessInput.addEventListener('input', (e) => {
            if(e.target.value.length > 0) {
                e.target.classList.add('border-primary-container');
            } else {
                e.target.classList.remove('border-primary-container');
            }
        });

        // Simple button active state visual feedback
        const btn = document.querySelector('button[type="submit"]');
        btn.addEventListener('click', () => {
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            `;
            setTimeout(() => {
                btn.innerHTML = 'Proceed <span class="material-symbols-outlined text-[20px]">arrow_forward</span>';
            }, 2000);
        });
    </script>
