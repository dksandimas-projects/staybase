<!-- Mobile Bottom Navigation (Suppressed on 404 per "The Filter" rule, but implemented for shell consistency if it were a top-level page. Here I prioritize Canvas as per instructions for focused journeys/dead ends.) -->
<script>
        // Micro-interaction for the illustration parallax
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            const illustration = document.querySelector('.group');
            if(illustration) {
                illustration.style.transform = `translate(${x}px, ${y}px)`;
            }
        });

        // Simple animation entry
        window.addEventListener('DOMContentLoaded', () => {
            document.querySelector('.animate-fade-in').style.opacity = '0';
            document.querySelector('.animate-fade-in').style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                const el = document.querySelector('.animate-fade-in');
                el.style.transition = 'all 1s ease-out';
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
