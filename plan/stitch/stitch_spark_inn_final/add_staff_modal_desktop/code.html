<body class="bg-page-bg font-body-sm text-on-surface antialiased flex h-screen w-screen overflow-hidden">
<!-- Mock Background Content to show overlay effect -->
<div class="flex-1 flex flex-col blur-sm opacity-50 pointer-events-none transition-all duration-300">
<!-- SideNavBar Skeleton -->
<div class="fixed left-0 top-0 h-full w-sidebar-width bg-[#111827] border-r border-border-standard flex flex-col py-6">
<div class="px-8 mb-8">
<span class="font-h2 text-h2 text-on-primary lowercase">spark inn</span>
</div>
<div class="flex items-center gap-3 px-4 py-3 text-secondary-fixed-dim">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</div>
</div>
<!-- Main Content Area Skeleton -->
<div class="ml-sidebar-width flex-1 p-8">
<h1 class="font-h3 text-h3 text-primary mb-6">Staff Management</h1>
<div class="bg-surface-container-lowest border border-border-standard rounded-lg p-6 h-96"></div>
</div>
</div>
<!-- Modal Backdrop Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-inverse-surface/40 backdrop-blur-sm p-4">
<!-- Add Staff Modal -->
<div class="bg-surface-container-lowest rounded-lg w-full max-w-max-width-auth shadow-xl border border-border-standard flex flex-col animate-[fadeIn_0.2s_ease-out]">
<!-- Modal Header -->
<div class="flex items-center justify-between px-6 py-5 border-b border-border-standard">
<h2 class="font-h2 text-h2 text-on-surface">Add New Staff</h2>
<button aria-label="Close modal" class="text-text-secondary hover:text-on-surface transition-colors w-11 h-11 flex items-center justify-center rounded-DEFAULT hover:bg-surface-container focus:outline-none focus:ring-2 focus:ring-primary-container" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body -->
<form class="p-6 flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-text-secondary" for="fullName">Full Name</label>
<input class="w-full h-touch-target-min px-4 font-body-sm text-on-surface bg-surface-container-lowest border border-border-standard rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all" id="fullName" name="fullName" placeholder="e.g. Jane Doe" type="text">
</div>
<!-- Email Address Field -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-text-secondary" for="email">Email Address</label>
<input class="w-full h-touch-target-min px-4 font-body-sm text-on-surface bg-surface-container-lowest border border-border-standard rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all" id="email" name="email" placeholder="jane@sparkinn.com" type="email">
</div>
<!-- Role Selection (Segmented Control) -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-text-secondary">System Role</label>
<div class="flex bg-surface-container-low p-1 rounded-lg border border-border-standard">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="role" type="radio" value="admin">
<div class="h-touch-target-min flex items-center justify-center font-label-md text-label-md rounded-DEFAULT peer-checked:bg-surface-container-lowest peer-checked:text-on-surface peer-checked:shadow-sm text-text-secondary hover:text-on-surface transition-all">
                                Admin
                            </div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="front_desk">
<div class="h-touch-target-min flex items-center justify-center font-label-md text-label-md rounded-DEFAULT peer-checked:bg-surface-container-lowest peer-checked:text-on-surface peer-checked:shadow-sm text-text-secondary hover:text-on-surface transition-all">
                                Front Desk
                            </div>
</label>
</div>
<p class="font-label-sm text-label-sm text-text-secondary mt-1 ml-1">Admins have full access. Front Desk handles bookings only.</p>
</div>
<!-- Modal Footer Actions -->
<div class="flex items-center justify-end gap-3 mt-4 pt-4 border-t border-border-standard">
<button class="h-touch-target-min px-6 font-label-md text-label-md text-text-secondary border border-border-standard rounded-lg hover:bg-surface-container-low hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-border-standard" type="button">
                        Cancel
                    </button>
<button class="h-touch-target-min px-6 font-label-md text-label-md text-on-error bg-primary-container rounded-lg hover:bg-primary-hover transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container" type="submit">
                        Add Staff
                    </button>
</div>
</form>
</div>
</div>
</body></html>
