<script>
        // Simple Interaction: Toggle active state for room chips
        const chips = document.querySelectorAll('button[class*="shrink-0"]');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.classList.remove('bg-primary', 'text-on-primary');
                    c.classList.add('bg-surface-container', 'text-on-surface-variant');
                });
                chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
                chip.classList.add('bg-primary', 'text-on-primary');
            });
        });

        // Close logic
        document.getElementById('backdrop').addEventListener('click', () => {
            document.getElementById('filter-drawer').style.display = 'none';
            document.getElementById('backdrop').style.display = 'none';
        });
