<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        @font-face {
            font-family: 'Apollo';
            src: url('https://fonts.cdnfonts.com/css/apollo') format('woff2'); /* Fallback to a serif style if not available */
        }
        body {
            background-color: #FDF8F3;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .glass-effect {
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.7);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed": "#ffdcc0",
                      "primary": "#8d4f00",
                      "status-blue-bg": "#EFF6FF",
                      "secondary-container": "#d9dff5",
                      "inverse-primary": "#ffb876",
                      "surface-variant": "#e2e2e2",
                      "outline": "#877363",
                      "secondary-fixed": "#dce2f7",
                      "primary-light": "#FEF3E2",
                      "on-tertiary": "#ffffff",
                      "tertiary": "#605e5a",
                      "status-amber-text": "#D97706",
                      "on-primary-fixed": "#2d1600",
                      "error-container": "#ffdad6",
                      "primary-hover": "#C4720E",
                      "page-bg": "#F9FAFB",
                      "on-secondary-container": "#5c6274",
                      "primary-container": "#ea8a1a",
                      "status-purple-bg": "#F5F3FF",
                      "surface-container-low": "#f3f3f3",
                      "status-amber-bg": "#FFFBEB",
                      "primary-fixed-dim": "#ffb876",
                      "status-gray-bg": "#F3F4F6",
                      "inverse-surface": "#303030",
                      "border-standard": "#E5E7EB",
                      "surface-dim": "#dadada",
                      "on-surface-variant": "#544335",
                      "status-gray-text": "#6B7280",
                      "status-red-bg": "#FEF2F2",
                      "outline-variant": "#dac2af",
                      "status-green-text": "#16A34A",
                      "on-surface": "#1b1b1b",
                      "surface-tint": "#8d4f00",
                      "text-secondary": "#4B5563",
                      "on-primary": "#ffffff",
                      "secondary-fixed-dim": "#c0c6db",
                      "on-tertiary-fixed": "#1d1b19",
                      "status-red-text": "#DC2626",
                      "tertiary-fixed-dim": "#cac6c1",
                      "on-secondary-fixed-variant": "#404758",
                      "error": "#ba1a1a",
                      "on-background": "#1b1b1b",
                      "background": "#f9f9f9",
                      "on-error-container": "#93000a",
                      "tertiary-fixed": "#e6e2dd",
                      "tertiary-container": "#a4a19d",
                      "status-green-bg": "#F0FDF4",
                      "on-tertiary-fixed-variant": "#484643",
                      "surface-bright": "#f9f9f9",
                      "status-blue-text": "#2563EB",
                      "on-error": "#ffffff",
                      "surface-container-high": "#e8e8e8",
                      "surface": "#f9f9f9",
                      "on-secondary-fixed": "#141b2b",
                      "on-primary-fixed-variant": "#6b3b00",
                      "inverse-on-surface": "#f1f1f1",
                      "secondary": "#575e70",
                      "on-secondary": "#ffffff",
                      "on-primary-container": "#562e00",
                      "surface-container-highest": "#e2e2e2",
                      "surface-container": "#eeeeee",
                      "status-purple-text": "#7C3AED",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary-container": "#393835"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "max-width-booking": "600px",
                      "max-width-auth": "460px",
                      "unit": "8px",
                      "touch-target-min": "44px",
                      "sidebar-width": "240px",
                      "drawer-width": "480px"
              },
              "fontFamily": {
                      "h2": ["Apollo", "serif"],
                      "h1": ["Apollo", "serif"],
                      "display-hero-mobile": ["Apollo", "serif"],
                      "body-lg": ["Inter", "sans-serif"],
                      "h4": ["Inter", "sans-serif"],
                      "h3": ["Inter", "sans-serif"],
                      "label-sm": ["Inter", "sans-serif"],
                      "body-sm": ["Inter", "sans-serif"],
                      "display-hero": ["Apollo", "serif"],
                      "h1-mobile": ["Apollo", "serif"],
                      "label-md": ["Inter", "sans-serif"]
              },
              "fontSize": {
                      "h2": ["32px", {"lineHeight": "1.3", "letterSpacing": "0.05em", "fontWeight": "400"}],
                      "h1": ["40px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "400"}],
                      "display-hero-mobile": ["44px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "400"}],
                      "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "h4": ["18px", {"lineHeight": "1.4", "fontWeight": "600"}],
                      "h3": ["24px", {"lineHeight": "1.4", "fontWeight": "600"}],
                      "label-sm": ["12px", {"lineHeight": "1.2", "fontWeight": "500"}],
                      "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "display-hero": ["72px", {"lineHeight": "1.1", "letterSpacing": "0.05em", "fontWeight": "400"}],
                      "h1-mobile": ["28px", {"lineHeight": "1.3", "fontWeight": "400"}],
                      "label-md": ["13px", {"lineHeight": "1.2", "fontWeight": "500"}]
              }
            },
          },
        }
      </script>
</head>
<body class="min-h-screen flex flex-col font-body-lg text-on-surface">
<!-- Hero Background Element for Depth -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute -top-[20%] -right-[10%] w-[60%] h-[60%] bg-primary-light/30 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -left-[5%] w-[50%] h-[50%] bg-secondary-container/20 rounded-full blur-[100px]"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 flex-grow flex items-center justify-center p-6 md:p-12">
<!-- Auth Card -->
<div class="w-full max-w-auth bg-surface-container-lowest rounded-xl shadow-xl overflow-hidden border border-white/50 flex flex-col items-center p-10 md:p-12">
<!-- Brand Identity -->
<div class="mb-10 text-center">
<img alt="spark inn logo" class="h-10 mb-8 mx-auto" data-alt="A clean and sophisticated corporate logo for a high-end luxury hospitality brand named 'spark inn'. The logo is displayed in a elegant, minimalist lowercase font with a warm, professional aesthetic. It is set against a pristine, soft white background that evokes a sense of calm and premium quality service. The lighting is bright and airy, highlighting the crisp lines of the brand's visual identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDVzDAyhXa5oP8FAtR9Nr0dePVhgBRw-t1DEXpCjjtjiDdYaDHNYKfhpb5cqggzXSjK0wSyeCqr8okemiFkAROb0z6xb2FnKf2La5uCGYHUewyldugufAJH2JX73Atdn61qkzc3oFDL_1F_aApr9_dfGVf4u_aZKOh0y5M9qSFl8e0RR_3_5IT2W6mk8bFphxYkfpKNTKTzwMUI1q3BG_t_Kg9AwDi-Rf10KQSN6fh-CcSQHJgQEeiXseUYr1uuF_z63d6z_zfylec8">
<h2 class="font-h2 text-h2 text-primary lowercase tracking-tight">Welcome back</h2>
<p class="font-body-sm text-body-sm text-text-secondary mt-2">Sign in to manage your stay and experiences.</p>
</div>
<!-- Sign In Form -->
<form class="w-full space-y-6" id="loginForm" onsubmit="return false;">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-[44px] px-4 rounded-lg border-border-standard focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all duration-200 bg-surface-container-low/50 font-body-sm" id="email" placeholder="your@email.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-hover transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full h-[44px] px-4 pr-12 rounded-lg border-border-standard focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all duration-200 bg-surface-container-low/50 font-body-sm" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-[44px] bg-primary-container text-white font-label-md text-label-md rounded-lg shadow-sm hover:bg-primary-hover active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-4 my-10">
<div class="h-[1px] flex-grow bg-border-standard"></div>
<span class="font-label-sm text-label-sm text-text-secondary">or</span>
<div class="h-[1px] flex-grow bg-border-standard"></div>
</div>
<!-- Ghost Button for Registration -->
<button class="w-full h-[44px] border border-border-standard text-on-surface-variant font-label-md text-label-md rounded-lg hover:bg-surface-container-low transition-all duration-200 active:scale-[0.98] flex items-center justify-center" type="button">
                Create Account
            </button>
</div>
<!-- Atmospheric Footer Credit -->
<div class="absolute bottom-8 left-0 right-0 text-center font-label-sm text-label-sm text-on-surface-variant opacity-60">
            © 2024 spark inn. all rights reserved.
        </div>
</main>
<script>
        // Password visibility toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const iconSpan = toggleBtn.querySelector('.material-symbols-outlined');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            iconSpan.textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Simple button interaction
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]" data-icon="progress_activity">progress_activity</span> Authenticating...';
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 1500);
        });
    </script>
</body></html>
