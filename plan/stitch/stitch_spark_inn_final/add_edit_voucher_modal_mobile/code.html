<body class="bg-page-bg font-body-lg text-on-surface h-screen overflow-hidden flex flex-col md:flex-row w-full">
<!-- Background Layer (Simulated Rate Management A-05) -->
<div class="flex-1 flex flex-col relative blur-sm opacity-50 z-0">
<!-- TopAppBar (from JSON) -->
<header class="bg-surface-container-lowest dark:bg-surface-dim docked full-width top-0 z-40 border-b border-border-standard dark:border-outline-variant flat no shadows flex justify-between items-center w-full px-6 h-16 shrink-0">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed cursor-pointer active:scale-95 duration-200" style="font-variation-settings: 'FILL' 0;">menu</span>
<span class="font-h2 text-h2-mobile lowercase text-primary dark:text-primary-fixed">spark inn</span>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors cursor-pointer active:scale-95 duration-200 p-2 rounded-full" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</div>
</header>
<!-- Main Content Area Simulated -->
<main class="flex-1 p-6 overflow-y-auto">
<div class="max-w-4xl mx-auto space-y-6">
<div class="flex justify-between items-center">
<h1 class="font-h3 text-h3 text-on-surface">Vouchers</h1>
<button class="bg-primary-container text-on-primary-container font-label-md text-label-md px-4 py-2 rounded-lg flex items-center gap-2 h-touch-target-min">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add</span>
                        Add Voucher
                    </button>
</div>
<!-- Simulated Table/List -->
<div class="bg-surface-container-lowest rounded-xl border border-border-standard p-4">
<div class="space-y-4">
<div class="h-12 bg-surface-container-high rounded-md animate-pulse"></div>
<div class="h-12 bg-surface-container-high rounded-md animate-pulse"></div>
<div class="h-12 bg-surface-container-high rounded-md animate-pulse"></div>
</div>
</div>
</div>
</main>
</div>
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-50 flex items-end md:items-center justify-center p-0 md:p-6 transition-opacity duration-300">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full md:max-w-md rounded-t-2xl md:rounded-2xl shadow-xl flex flex-col max-h-[795px] overflow-hidden transform transition-transform duration-300 translate-y-0">
<!-- Modal Header -->
<div class="px-6 py-4 border-b border-border-standard flex justify-between items-center shrink-0">
<h2 class="font-h3 text-h3 text-on-surface font-semibold" style="font-family: 'Apollo', sans-serif;">Add New Voucher</h2>
<button class="text-text-secondary hover:text-on-surface transition-colors p-2 -mr-2 rounded-full hover:bg-surface-container-low active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Modal Body (Scrollable) -->
<div class="p-6 overflow-y-auto flex-1 space-y-5">
<!-- Voucher Code -->
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm text-text-secondary" for="voucher_code">Voucher Code</label>
<input class="w-full h-touch-target-min px-4 rounded-lg border border-border-standard bg-surface-container-lowest text-on-surface font-body-sm text-body-sm focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors uppercase placeholder:normal-case" id="voucher_code" placeholder="e.g. SUMMER24" type="text">
</div>
<!-- Discount Type & Value -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm text-text-secondary">Discount Type</label>
<div class="flex h-touch-target-min rounded-lg border border-border-standard bg-surface-container-low p-1 relative">
<!-- Toggle Background Slider (Simplified for static HTML, normally JS driven) -->
<div class="absolute left-1 top-1 bottom-1 w-[calc(50%-4px)] bg-surface-container-lowest rounded shadow-sm border border-border-standard z-0"></div>
<label class="flex-1 flex items-center justify-center font-label-sm text-label-sm text-on-surface cursor-pointer z-10 rounded">
<input checked="" class="sr-only" name="discount_type" type="radio" value="percentage">
                                Percentage
                            </label>
<label class="flex-1 flex items-center justify-center font-label-sm text-label-sm text-text-secondary cursor-pointer z-10 rounded hover:text-on-surface transition-colors">
<input class="sr-only" name="discount_type" type="radio" value="fixed">
                                Fixed
                            </label>
</div>
</div>
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm text-text-secondary" for="discount_value">Discount Value</label>
<div class="relative flex items-center">
<input class="w-full h-touch-target-min pl-4 pr-8 rounded-lg border border-border-standard bg-surface-container-lowest text-on-surface font-body-sm text-body-sm focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="discount_value" placeholder="0" type="number">
<span class="absolute right-4 font-body-sm text-body-sm text-text-secondary">%</span>
</div>
</div>
</div>
<!-- Usage Limit -->
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm text-text-secondary" for="usage_limit">Usage Limit</label>
<input class="w-full h-touch-target-min px-4 rounded-lg border border-border-standard bg-surface-container-lowest text-on-surface font-body-sm text-body-sm focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="usage_limit" placeholder="e.g. 100" type="number">
<p class="font-label-sm text-label-sm text-text-secondary/70 mt-1">Leave blank for unlimited uses.</p>
</div>
<!-- Expiry Date -->
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm text-text-secondary" for="expiry_date">Expiry Date</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-text-secondary" style="font-variation-settings: 'FILL' 0;">calendar_today</span>
<input class="w-full h-touch-target-min pl-12 pr-4 rounded-lg border border-border-standard bg-surface-container-lowest text-on-surface font-body-sm text-body-sm focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors appearance-none" id="expiry_date" type="date">
</div>
</div>
<!-- Status Toggle -->
<div class="flex items-center justify-between pt-2">
<div class="space-y-0.5">
<label class="font-label-md text-label-md text-on-surface block">Status</label>
<p class="font-label-sm text-label-sm text-text-secondary">Voucher is currently active</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value="">
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-border-standard after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
</div>
<!-- Modal Footer (Actions) -->
<div class="px-6 py-4 border-t border-border-standard bg-surface-container-lowest flex flex-col-reverse md:flex-row justify-end gap-3 shrink-0">
<button class="w-full md:w-auto h-touch-target-min px-6 rounded-lg border border-border-standard text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
                    Cancel
                </button>
<button class="w-full md:w-auto h-touch-target-min px-6 rounded-lg bg-primary-container text-[#000000] font-label-md text-label-md hover:bg-primary-hover transition-colors active:scale-95 duration-200 shadow-sm">
                    Save Voucher
                </button>
</div>
</div>
</div>
