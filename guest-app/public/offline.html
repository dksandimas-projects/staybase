<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EA8A1A" />
    <link rel="icon" href="/brand/ICON LOGO.png" />
    <title>spark inn — Offline</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: #FEF3E2;
        color: #2D2A26;
        padding: 1.5rem;
      }
      main {
        max-width: 28rem;
        text-align: center;
        background: #ffffff;
        border-radius: 1rem;
        padding: 2rem 1.75rem;
        box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
      p { margin: 0.5rem 0 1.25rem; line-height: 1.5; color: #6B665F; }
      button {
        font: inherit;
        font-weight: 600;
        background: #EA8A1A;
        color: #ffffff;
        border: 0;
        border-radius: 0.625rem;
        padding: 0.75rem 1.5rem;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        We couldn't reach the internet just now. Check your connection and
        try again — your booking and personal info are safe.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
