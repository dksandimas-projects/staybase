    <meta
      name="description"
      content="Book your stay at spark inn, a boutique hotel in Bohol, Philippines."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="spark inn" />
    <meta property="og:title" content="spark inn" />
    <meta
      property="og:description"
      content="Book your stay at spark inn, a boutique hotel in Bohol, Philippines."
    />
    <meta property="og:image" content="https://sparkinnbohol.com/brand/FINAL%20LOGO.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="spark inn" />
    <meta property="og:locale" content="en-PH" />
    <meta property="og:url" content="https://sparkinnbohol.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="spark inn" />
    <meta
      name="twitter:description"
      content="Book your stay at spark inn, a boutique hotel in Bohol, Philippines."
    />
    <meta name="twitter:image" content="https://sparkinnbohol.com/brand/FINAL%20LOGO.png" />
    <meta name="twitter:site" content="" />
    <script type="application/ld+json" id="hotel-json-ld">{}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Image CDN preconnects. The hero photos on the public site are
      the LCP element on every page, so the TLS handshake needs to
      finish as early as possible. `crossorigin` is required for any
      host that serves CORS-bearing responses (the Google and
      Firebase Storage hosts do; Unsplash does not, so we skip
      `crossorigin` for that one). The actual `<link rel="preload">`
      for the resolved hero URL is injected at runtime by
      `HeroImage.tsx` once `usePublicSiteContent` resolves.
    -->
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" href="/brand/icon-192.png" />
    <link rel="icon" href="/brand/ICON LOGO.png" />
    <title>spark inn</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Hero-image early-preload: reads the publicSiteContent localStorage
      cache synchronously (same envelope written by usePublicSiteContent)
      and injects <link rel="preload"> tags for every hero URL before the
      JS bundle even starts parsing. On a returning visitor this shaves
      the entire React-mount + Firestore round-trip delay off LCP.
      Served as an external file (not inline) because the CSP script-src
      has no 'unsafe-inline' — see /public/hero-preload.js.
    -->
    <script src="/hero-preload.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
