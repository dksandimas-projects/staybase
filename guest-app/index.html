<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Book your stay at spark inn, a boutique hotel in Bohol, Philippines."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="spark inn" />
    <meta property="og:title" content="spark inn" />
    <meta
      property="og:description"
      content="Book your stay at spark inn, a boutique hotel in Bohol, Philippines."
    />
    <meta property="og:image" content="https://sparkinnbohol.com/brand/FINAL%20LOGO.png" />
    <meta property="og:url" content="https://sparkinnbohol.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="spark inn" />
    <meta
      name="twitter:description"
      content="Book your stay at spark inn, a boutique hotel in Bohol, Philippines."
    />
    <meta name="twitter:image" content="https://sparkinnbohol.com/brand/FINAL%20LOGO.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Image CDN preconnects. The hero photos on the public site are
      the LCP element on every page, so the TLS handshake needs to
      finish as early as possible. `crossorigin` is required for any
      host that serves CORS-bearing responses (the Google and
      Firebase Storage hosts do; Unsplash does not, so we skip
      `crossorigin` for that one). The actual `<link rel="preload">`
      for the resolved hero URL is injected at runtime by
      `HeroImage.tsx` once `usePublicSiteContent` resolves.
    -->
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" href="/brand/icon-192.png" />
    <link rel="icon" href="/brand/ICON LOGO.png" />
    <title>spark inn</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Hero-image early-preload: reads the publicSiteContent localStorage
      cache synchronously (same envelope written by usePublicSiteContent)
      and injects <link rel="preload"> tags for every hero URL before the
      JS bundle even starts parsing. On a returning visitor this shaves
      the entire React-mount + Firestore round-trip delay off LCP.
      The script is intentionally tiny and wrapped in try/catch so any
      storage error (private mode, quota exceeded, malformed JSON) is
      silently ignored — the runtime HeroImage preload fires as the
      fallback.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("publicSiteContent:v2");
          if (!raw) return;
          var envelope = JSON.parse(raw);
          var content = envelope && envelope.value;
          if (!content) return;
          var urls = [
            content.homepage  && content.homepage.heroPhotoUrl,
            content.about     && content.about.heroPhotoUrl,
            content.corporate && content.corporate.heroPhotoUrl,
            content.rewards   && content.rewards.heroPhotoUrl
          ];
          for (var i = 0; i < urls.length; i++) {
            var url = urls[i];
            if (typeof url !== "string" || url.length === 0) continue;
            var link = document.createElement("link");
            link.rel = "preload";
            link.as = "image";
            link.href = url;
            link.setAttribute("fetchpriority", "high");
            link.dataset.heroEarlyPreload = "true";
            document.head.appendChild(link);
          }
        } catch (e) { /* best-effort — storage disabled or JSON malformed */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
